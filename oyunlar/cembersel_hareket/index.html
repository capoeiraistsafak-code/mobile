<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çembersel Hareket · 3D Görev Oyunu</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1f232c;font-family:Inter,system-ui,sans-serif;color:#e5e7eb;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(circle at 50% 45%,#3a4150,#1f232c);overflow:hidden}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.hide{display:none!important}

/* üst bant */
#top{position:absolute;left:24px;right:24px;top:20px;height:100px;display:flex;align-items:center;gap:22px;background:#2a303c;border:3px solid #F5A300;border-radius:22px;padding:0 18px 0 22px;z-index:5}
.pill{display:inline-block;background:#D62828;color:#fff;font:900 30px Inter;padding:8px 20px;border-radius:12px;white-space:nowrap}
#tTitle{font:800 40px/1.1 Inter;color:#F5C400;white-space:nowrap}
#tTask{flex:1;min-width:0;font:600 26px/1.25 Inter;color:#e5e7eb}
.tb{flex:none;width:76px;height:76px;border-radius:18px;background:#3a4150;color:#fff;font:700 36px Inter;display:flex;align-items:center;justify-content:center;border:2px solid #556070}
.tb:active{transform:scale(.94)}

/* veri tahtası */
#board{position:absolute;left:24px;top:142px;width:max-content;min-width:360px;max-width:500px;background:rgba(36,41,52,.94);border:3px solid #4b5566;border-radius:20px;padding:16px 20px 18px;z-index:4}
#board h3{font:800 24px Inter;color:#94a3b8;letter-spacing:1px;margin:4px 0 8px}
.row{font:600 27px/1.35 Inter;color:#e5e7eb;white-space:nowrap}
.row b{color:#F5C400;font-weight:800}
.row.f b{color:#4ade80}
.row.f{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* alt yazı */
#sub{position:absolute;left:1040px;bottom:26px;transform:translateX(-50%);width:max-content;max-width:880px;background:rgba(10,12,18,.84);border-radius:16px;padding:14px 30px;font:600 34px/1.3 Inter;text-align:center;color:#fff;z-index:4;transition:left .4s}
#sub:empty{display:none}
#sub.q{left:875px;max-width:580px;font-size:30px}

/* devam düğmesi */
#ctl{position:absolute;left:24px;bottom:24px;z-index:6;display:flex;gap:10px;align-items:center;background:rgba(36,41,52,.94);border:3px solid #4b5566;border-radius:20px;padding:8px}
#ctl button{height:68px;min-width:68px;border-radius:14px;background:#3a4150;color:#fff;font:800 26px Inter;border:2px solid #556070;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
#ctl button.on{background:#F5A300;color:#1f232c;border-color:#F5A300}
#ctl button:active{transform:scale(.94)}
#bDur{width:190px}
#bDur svg{flex:none;width:28px;height:28px;fill:currentColor}
#bDur.dur{background:#22c55e;color:#0b2b16;border-color:#22c55e;animation:nabiz 1.4s infinite}
#durRozet{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:6;background:rgba(10,12,18,.86);color:#F5C400;font:900 40px Inter;padding:10px 30px;border-radius:16px;border:3px solid #F5C400}
#hizRozet{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:5;background:rgba(10,12,18,.8);color:#8ec5ff;font:800 30px Inter;padding:8px 22px;border-radius:14px}
#go{position:absolute;right:36px;bottom:24px;z-index:6;font:800 42px Inter;background:#22c55e;color:#0b2b16;border-radius:22px;padding:22px 44px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:nabiz 1.4s infinite}
@keyframes nabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* soru kartı */
#qc{position:absolute;right:24px;top:142px;bottom:24px;width:720px;background:#2a303c;border:3px solid #F5A300;border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;gap:16px;z-index:6;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#qn{align-self:flex-start;background:#F5A300;color:#1f232c;font:900 26px Inter;padding:6px 16px;border-radius:10px}
#qt{font:700 34px/1.3 Inter;color:#fff}
#qt b{color:#F5C400}
#qt small{font-size:28px;color:#cbd5e1;font-weight:600}
#opts{display:flex;flex-direction:column;gap:14px}
.op{display:flex;align-items:center;gap:18px;text-align:left;background:#3a4150;color:#fff;font:700 34px/1.2 Inter;padding:16px 20px;border-radius:18px;border:3px solid #556070;min-height:84px}
.op i{flex:none;font-style:normal;width:52px;height:52px;border-radius:12px;background:#1f232c;color:#F5C400;display:flex;align-items:center;justify-content:center;font:900 30px Inter}
.op:active{transform:scale(.98)}
.op.ok{background:#14532d;border-color:#4ade80}.op.ok i{background:#4ade80;color:#14532d}
.op.no{background:#7f1d1d;border-color:#f87171}.op.no i{background:#f87171;color:#7f1d1d}
.op.dim{display:none}
#qc.cev .op{min-height:0;padding:10px 18px;font-size:30px}#qc.cev .op i{width:44px;height:44px;font-size:26px}
#qc.cev #qt{font-size:30px}
#fb{font:900 36px Inter}#fb:empty{display:none}
#fb.ok{color:#4ade80}#fb.no{color:#f87171}
#sol{flex:1;min-height:0;overflow:hidden;font-size:44px;background:#1f232c;border-radius:18px;padding:12px 22px;border:2px dashed #475569}
#sol:empty{display:none}
#sol .sl{font:700 1em/1.22 Caveat;color:#8ec5ff;clip-path:inset(-10px 100% -10px 0);animation:yaz 1s forwards}
#sol .sl em{font-style:normal;color:#F5C400}
#sol .sl .g{color:#4ade80}#sol .sl .p{color:#c084fc}#sol .sl .r{color:#f87171}#sol .sl .o{color:#fb923c}
#sol .bas{font:800 24px Inter;color:#94a3b8;letter-spacing:1px;margin-bottom:2px}
@keyframes yaz{to{clip-path:inset(-10px -10px -10px 0)}}
#qnext{align-self:flex-end;font:800 40px Inter;background:#22c55e;color:#0b2b16;border-radius:20px;padding:18px 40px;animation:nabiz 1.4s infinite}

/* matematik */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 4px;font-size:.82em}
.fr>span:last-child{border-top:3px solid currentColor;padding-top:2px}
.fr>span{padding:0 4px}
.sq{white-space:nowrap}.sq>span{border-top:3px solid currentColor;padding:0 3px;margin-left:1px}
sup{font-size:.6em;vertical-align:.7em;line-height:0}
sub{font-size:.6em;vertical-align:-.2em;line-height:0}

/* 3B etiketleri */
#tags{position:absolute;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;font:900 36px Inter;padding:2px 12px;border-radius:12px;transform:translate(-50%,-50%);opacity:0;white-space:nowrap;color:#fff}
.lbl.odak,.chip.odak{z-index:6;animation:odak 1.1s ease-in-out infinite;box-shadow:0 0 0 4px #fff,0 0 30px 6px rgba(245,196,0,.85)}
@keyframes odak{0%,100%{transform:translate(-50%,-50%) scale(1.18)}50%{transform:translate(-50%,-50%) scale(1.32)}}
#tags .lbl,#tags .chip{z-index:1}
.chip{position:absolute;font:700 40px/1.05 Caveat;color:#fff;background:rgba(17,24,39,.9);border:3px solid #fff;border-radius:14px;padding:4px 14px;transform:translate(-50%,-50%);opacity:0;white-space:nowrap;text-align:center}

/* katmanlar: menü, giriş, bitiş */
#menu{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 40%,rgba(58,65,80,.78),rgba(31,35,44,.95))}
.m-top{margin-top:54px}
.m-bas{margin-top:22px;font:900 96px/1.05 Inter;background:linear-gradient(90deg,#fde047 0%,#fb923c 45%,#ef4444 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(249,115,22,.45))}
.m-alt{margin-top:14px;font:700 40px Inter;color:#cbd5e1}
.m-alt b{color:#F5C400}
#cards{margin-top:46px;display:flex;gap:30px}
.card{width:400px;height:430px;background:#2a303c;border:4px solid #4b5566;border-radius:28px;padding:26px 26px 22px;display:flex;flex-direction:column;text-align:left;color:#fff;position:relative}
.card:hover,.card:focus{border-color:#F5A300}
.card:active{transform:scale(.97)}
.c-ic{font-size:86px;line-height:1;font-family:"Noto Color Emoji",sans-serif}
.c-no{position:absolute;right:24px;top:24px;font:900 26px Inter;color:#1f232c;background:#F5A300;padding:6px 14px;border-radius:10px}
.c-ad{margin-top:18px;font:800 38px/1.12 Inter;color:#F5C400}
.c-ac{margin-top:12px;font:600 26px/1.3 Inter;color:#cbd5e1;flex:1}
.c-st{font:800 30px Inter;color:#4ade80}
.c-st.yok{color:#94a3b8}
.m-not{margin-top:36px;font:600 28px Inter;color:#94a3b8;text-align:center;line-height:1.5}
.m-not kbd{font:800 24px Inter;background:#3a4150;border:2px solid #556070;border-radius:8px;padding:2px 10px;color:#fff}
.m-logo{position:absolute;left:40px;bottom:34px;display:flex;align-items:center;gap:18px;font:800 32px Inter;color:#fff}
.m-logo i{width:92px;height:92px;border-radius:50%;border:6px solid #F5A300;background:url(logo.png) center/cover}
.m-fs{position:absolute;right:40px;bottom:40px;font:800 30px Inter;background:#3a4150;color:#fff;border:2px solid #556070;border-radius:16px;padding:16px 26px}

#ov{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(20,23,30,.62)}
.ov-k{width:1100px;background:#2a303c;border:4px solid #F5A300;border-radius:30px;padding:46px 56px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.ov-ic{font-size:110px;line-height:1;font-family:"Noto Color Emoji",sans-serif}
.ov-b{margin-top:18px;font:900 64px/1.1 Inter;color:#F5C400}
.ov-t{margin-top:20px;font:600 36px/1.35 Inter;color:#e5e7eb}
.ov-s{margin-top:18px;font:700 32px Inter;color:#94a3b8}
.ov-y{margin-top:16px;font-size:80px;letter-spacing:10px;color:#F5C400}
.ov-dg{margin-top:36px;display:flex;gap:24px;justify-content:center}
.btn{font:800 40px Inter;border-radius:20px;padding:20px 40px;background:#3a4150;color:#fff;border:3px solid #556070}
.btn.ana{background:#22c55e;color:#0b2b16;border-color:#22c55e}
.btn:active{transform:scale(.96)}
</style></head><body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="tags"></div>

  <div id="top" class="hide">
    <span class="pill" id="tNo">GÖREV 1</span>
    <div id="tTitle"></div>
    <div id="tTask"></div>
    <button class="tb" id="bSes" title="Ses (M)">🔊</button>
    <button class="tb" id="bBas" title="Görevi baştan başlat">↺</button>
    <button class="tb" id="bMenu" title="Menü">☰</button>
  </div>
  <div id="board" class="hide"></div>
  <div id="sub"></div>
  <button id="go" class="hide">▶ Başlat</button>
  <div id="ctl" class="hide">
    <button id="bDur" title="Duraklat / Devam et (P)"></button>
    <button data-h="0.25">¼×</button><button data-h="0.5">½×</button><button data-h="1" class="on">1×</button><button data-h="2">2×</button>
  </div>
  <div id="durRozet" class="hide">DURAKLATILDI</div>
  <div id="hizRozet" class="hide"></div>

  <div id="qc" class="hide">
    <div id="qn">SORU 1</div>
    <div id="qt"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <div id="sol"></div>
    <button id="qnext" class="hide">Devam ▶</button>
  </div>

  <div id="ov" class="hide"></div>

  <div id="menu">
    <div class="m-top"><span class="pill" style="font-size:40px;padding:10px 26px">AYT FİZİK</span></div>
    <div class="m-bas">ÇEMBERSEL HAREKET</div>
    <div class="m-alt">3D Görev Oyunu · <b>Hesapla, cevapla, görevi tamamla!</b></div>
    <div id="cards"></div>
    <div class="m-not">Doğru cevapta animasyon devam eder · Yanlış cevapta önce çözüm gösterilir<br>
      Kısayollar: <kbd>1</kbd>–<kbd>4</kbd> şık seç · <kbd>Boşluk</kbd> devam · <kbd>P</kbd> duraklat · <kbd>−</kbd>/<kbd>+</kbd> hız · <kbd>M</kbd> ses · <kbd>F</kbd> tam ekran</div>
    <div class="m-logo"><i></i>Şafak Hoca · Fizik</div>
    <button class="m-fs" id="bFs">⛶ Tam ekran</button>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const TAU = Math.PI * 2;
const mod = (x, m) => ((x % m) + m) % m;
// yazım yardımcıları
const F = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const SQ = x => `<span class="sq">√<span>${x}</span></span>`;
const OM = 'ω', AL = 'α';

// ======================= ÖLÇEKLEME (akıllı tahta / her ekran) =======================
let SCALE = 1;
function fit() {
  const w = innerWidth, h = innerHeight; SCALE = Math.min(w / 1920, h / 1080);
  $('stage').style.transform = `translate(${(w - 1920 * SCALE) / 2}px,${(h - 1080 * SCALE) / 2}px) scale(${SCALE})`;
  R3.setPixelRatio(Math.min(2, (window.devicePixelRatio || 1) * SCALE)); R3.setSize(1920, 1080, false);
}

// ======================= SES (yalnız efekt, tarayıcıda üretilir) =======================
const AU = { ctx: null, on: true, loops: [] };
try { AU.on = localStorage.getItem('ch_ses') !== '0'; } catch (e) {}
function ac() {
  if (!AU.ctx) {
    try {
      const C = window.AudioContext || window.webkitAudioContext; AU.ctx = new C();
      AU.m = AU.ctx.createGain(); AU.m.gain.value = AU.on ? 0.8 : 0; AU.m.connect(AU.ctx.destination);
      const n = AU.ctx.createBuffer(1, AU.ctx.sampleRate * 2, AU.ctx.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AU.nb = n;
    } catch (e) { AU.ctx = null; }
  }
  if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  return AU.ctx;
}
function tone(f, dur, { type = 'sine', vol = .25, at = 0, to = null } = {}) {
  const c = ac(); if (!c) return; const t = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.m); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, { type = 'lowpass', f = 1000, f2 = null, q = 1, vol = .3, at = 0 } = {}) {
  const c = ac(); if (!c) return; const t = c.currentTime + at;
  const s = c.createBufferSource(); s.buffer = AU.nb; const fl = c.createBiquadFilter(); fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(AU.m); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const SFX = {
  click: () => tone(900, .05, { type: 'square', vol: .06 }),
  ok: () => { tone(660, .18, { vol: .22 }); tone(880, .18, { vol: .22, at: .12 }); tone(1320, .4, { vol: .2, at: .24 }); },
  bad: () => { tone(220, .4, { type: 'sawtooth', vol: .12, to: 140 }); tone(170, .45, { type: 'square', vol: .05, at: .05, to: 110 }); },
  snap: () => { noise(.12, { type: 'highpass', f: 2500, vol: .5 }); tone(1400, .08, { type: 'triangle', vol: .15, to: 400 }); },
  whoosh: () => noise(1.0, { type: 'bandpass', f: 300, f2: 2600, q: 1.2, vol: .4 }),
  ding: () => { tone(1047, .7, { vol: .2 }); tone(1568, .9, { vol: .12, at: .06 }); },
  splash: () => { noise(.7, { type: 'lowpass', f: 2000, f2: 300, vol: .55 }); noise(.35, { type: 'highpass', f: 3000, vol: .15, at: .05 }); },
  boing: () => { tone(140, .7, { vol: .4, to: 420 }); noise(.15, { type: 'lowpass', f: 600, vol: .4 }); },
  bell: () => { for (let i = 0; i < 3; i++) { tone(1318, .55, { type: 'triangle', vol: .18, at: i * .35 }); tone(1975, .45, { vol: .06, at: i * .35 }); } },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 4 ? .8 : .35, { type: 'triangle', vol: .2, at: i * .12 })),
  pour: () => noise(1.3, { type: 'bandpass', f: 900, f2: 1600, q: .8, vol: .3 }),
  clack: () => { noise(.05, { type: 'highpass', f: 1800, vol: .22 }); tone(240, .06, { type: 'square', vol: .05 }); },
  start: () => { tone(440, .12, { type: 'square', vol: .06 }); tone(660, .15, { type: 'square', vol: .06, at: .1 }); },
  horn: () => { tone(330, .7, { type: 'sawtooth', vol: .07 }); tone(415, .7, { type: 'sawtooth', vol: .06 }); },
};
// sürekli sesler: roket, araba motoru, tren gürültüsü, dönen kova
function loopSnd(kind) {
  const c = ac(); if (!c) return { set() {}, stop() {} };
  const out = c.createGain(); out.gain.value = 0; out.connect(AU.m); const srcs = []; let setF = () => {};
  const nz = () => { const s = c.createBufferSource(); s.buffer = AU.nb; s.loop = true; s.start(0, Math.random()); srcs.push(s); return s; };
  if (kind === 'rocket') {
    const s = nz(), bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = .6;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160; const g2 = c.createGain(); g2.gain.value = 2;
    s.connect(bp); bp.connect(out); s.connect(lp); lp.connect(g2); g2.connect(out);
    setF = r => bp.frequency.setTargetAtTime(450 + 500 * r, c.currentTime, .1);
  } else if (kind === 'engine') {
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.connect(out); const os = [];
    for (const f of [52, 78, 104]) { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const g = c.createGain(); g.gain.value = .25; o.connect(g); g.connect(lp); o.start(); srcs.push(o); os.push([o, f]); }
    setF = r => os.forEach(([o, f]) => o.frequency.setTargetAtTime(f * (0.8 + 0.5 * r), c.currentTime, .15));
  } else { // rumble / swish
    const s = nz(), lp = c.createBiquadFilter(); lp.type = kind === 'swish' ? 'bandpass' : 'lowpass'; lp.frequency.value = kind === 'swish' ? 700 : 260; lp.Q.value = .7;
    const g2 = c.createGain(); g2.gain.value = kind === 'swish' ? 1 : 1.6; s.connect(lp); lp.connect(g2); g2.connect(out);
    setF = r => lp.frequency.setTargetAtTime((kind === 'swish' ? 500 : 180) + (kind === 'swish' ? 900 : 300) * r, c.currentTime, .1);
  }
  const L = { v: 0, set(v, r = 0) { if (Math.abs(v - L.v) > .005) { out.gain.setTargetAtTime(v, c.currentTime, .08); L.v = v; } setF(r); },
    stop() { out.gain.setTargetAtTime(0, c.currentTime, .08); setTimeout(() => { srcs.forEach(s => { try { s.stop(); } catch (e) {} }); out.disconnect(); }, 500); } };
  AU.loops.push(L); return L;
}
function stopLoops() { AU.loops.forEach(l => l.stop()); AU.loops = []; }
function setSes(on) { AU.on = on; $('bSes').textContent = on ? '🔊' : '🔇'; if (AU.m) AU.m.gain.setTargetAtTime(on ? .8 : 0, AU.ctx.currentTime, .05); try { localStorage.setItem('ch_ses', on ? '1' : '0'); } catch (e) {} }

// ======================= 3D TEMEL (Tinkercad tarzı) =======================
const R3 = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
R3.shadowMap.enabled = true; R3.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(36, 1920 / 1080, 0.1, 200);

      o: ['20 000 N/m', '2 000 N/m', '600 N/m', '60 000 N/m'], lab: 'k = ?', at: 'yay', f: ['t4k'],
      s: [`Kinetik enerji yayda depolanır:`, `${F('1', '2')} · m · v<sup>2</sup> = ${F('1', '2')} · k · x<sup>2</sup>`, `k = ${F('m · v<sup>2</sup>', 'x<sup>2</sup>')} = ${F('200 · 900', '9')} = <em>20 000 N/m</em> ✓`],
      after: () => board('Yay sabiti', 'k = 20 000 N/m') } },
    { sub: 'Tren istasyona giriyor.', go: '🚉 İstasyona gir' },
    { do: S => { S.m = false; M4.go(S, 'end', ROLL.sContact); }, sub: 'Tren yaya yaklaşıyor…', until: S => !S.run },
    { do: S => { S.tc = 0; }, sub: 'Yay sıkışıyor: ½·m·v² → ½·k·x² (yavaş çekim)', until: S => S.done },
    { do: S => { S.ok = 'Tren istasyona ulaştı ✓'; }, sub: 'Tren istasyona ulaştı! Kinetik enerji yayda DEPOLANDI. En çok sıkışma anında istasyon freni treni tuttu (fren olmasa yay treni geri iterdi). 🎉', wait: 2.6 },
  ],
};

const MISSIONS = [M1, M2, M3, M4];

// ======================= OYUN MOTORU =======================
const GAME = { M: null, i: -1, wait: null, timer: 0, q: null, first: 0, total: 0, qn: 0, mode: 'menu' };
let done = {}; try { done = JSON.parse(localStorage.getItem('ch_yildiz') || '{}'); } catch (e) {}
function sub(t) { $('sub').innerHTML = t || ''; }
function board(k, v) { const d = document.createElement('div'); d.className = 'row f'; d.innerHTML = `${k}: <b>${v}</b>`; const bf = $('bFound'); bf.appendChild(d); while (bf.children.length > 5) bf.removeChild(bf.firstChild); $('bFoundH').classList.remove('hide'); }
function goBtn(label) { $('go').textContent = label; $('go').classList.remove('hide'); }

function buildMenu() {
  $('cards').innerHTML = '';
  MISSIONS.forEach(M => {
    const b = document.createElement('button'); b.className = 'card';
    const nq = M.steps.filter(s => s.q).length, y = done[M.no];
    b.innerHTML = `<div class="c-no">GÖREV ${M.no}</div><div class="c-ic">${M.icon}</div><div class="c-ad">${M.name}</div><div class="c-ac">${M.task}</div>
      <div class="c-st ${y == null ? 'yok' : ''}">${y == null ? `${nq} soru` : `✓ Tamamlandı · ${'★'.repeat(y)}${'☆'.repeat(3 - y)}`}</div>`;
    b.onclick = () => { ac(); SFX.click(); startMission(M); };
    $('cards').appendChild(b);
  });
}

function showOnly(M) { MISSIONS.forEach(m => m.group.visible = m === M); }

function startMission(M) {
  stopLoops(); GAME.M = M; GAME.i = -1; GAME.wait = null; GAME.timer = 0; GAME.first = 0; GAME.total = 0; GAME.qn = 0; GAME.mode = 'game';
  showOnly(M); M.reset();
  $('menu').classList.add('hide'); $('top').classList.remove('hide'); $('board').classList.remove('hide'); $('ctl').classList.remove('hide'); setDur(false);
  $('tNo').textContent = 'GÖREV ' + M.no; $('tTitle').textContent = M.name; $('tTask').textContent = M.task;
  $('board').innerHTML = `<h3>VERİLENLER</h3>${M.data.map(([k, v]) => `<div class="row">${k}: <b>${v}</b></div>`).join('')}<h3 id="bFoundH" class="hide" style="margin-top:14px">BULUNANLAR</h3><div id="bFound"></div>`;
  $('qc').classList.add('hide'); $('go').classList.add('hide'); sub(''); CAM.gvo = -200; CAM.vo = -200;
  const nq = M.steps.filter(s => s.q).length;
  overlay(`<div class="ov-ic">${M.icon}</div><div class="pill" style="margin-top:18px">GÖREV ${M.no}</div><div class="ov-b">${M.name}</div><div class="ov-t">${M.task}</div>
    <div class="ov-s">${nq} soru · Doğru cevapta devam · Yanlışta önce çözüm</div><div class="ov-dg"><button class="btn ana" id="ovGo">▶ Göreve başla</button></div>`);
  $('ovGo').onclick = () => { SFX.start(); closeOverlay(); next(); };
}
function overlay(html) { $('ov').innerHTML = `<div class="ov-k">${html}</div>`; $('ov').classList.remove('hide'); }
function closeOverlay() { $('ov').classList.add('hide'); }

function next() {
  const M = GAME.M; GAME.i++; const st = M.steps[GAME.i];
  $('go').classList.add('hide');
  if (!st) return finish();
  if (st.sub !== undefined) sub(st.sub);
  if (st.do) st.do(M.S, M);
  if (st.go) { goBtn(st.go); GAME.goFn = next; }
  else if (st.until) GAME.wait = st.until;
  else if (st.wait) GAME.timer = st.wait;
  else if (st.q) ask(st.q);
  else next();
}

function ask(q) {
  GAME.qn++; GAME.total++;
  const order = q.fixed ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i));
  GAME.q = { q, order, answered: false, correctPos: order.indexOf(0) };
  $('qn').textContent = `SORU ${GAME.qn} / ${GAME.M.steps.filter(s => s.q).length}`;
  $('qt').innerHTML = q.t; $('fb').textContent = ''; $('fb').className = ''; $('sol').innerHTML = ''; $('qnext').classList.add('hide');
  $('opts').innerHTML = order.map((oi, k) => `<button class="op" data-k="${k}"><i>${'ABCD'[k]}</i><span>${q.o[oi]}</span></button>`).join('');
  [...$('opts').children].forEach(b => b.onclick = () => answer(+b.dataset.k));
  $('qc').classList.remove('hide'); $('qc').classList.remove('cev'); $('sub').classList.add('q'); CAM.gvo = 170;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function answer(k) {
  const Q = GAME.q; if (!Q || Q.answered) return; Q.answered = true;
  const ok = k === Q.correctPos, btns = [...$('opts').children];
  btns.forEach((b, j) => { b.disabled = true; if (j === Q.correctPos) b.classList.add('ok'); else if (j === k) b.classList.add('no'); else b.classList.add('dim'); });
  if (ok) { GAME.first++; SFX.ok(); $('fb').className = 'ok'; $('fb').textContent = '✓ Doğru!'; }
  else { SFX.bad(); $('fb').className = 'no'; $('fb').textContent = '✗ Yanlış! Önce çözümü inceleyelim.'; }
  $('qc').classList.add('cev');
  const lines = Q.q.s, gap = ok ? 0.45 : 1.25;
  $('sol').innerHTML = `<div class="bas">${ok ? 'ÇÖZÜM' : 'DOĞRU ÇÖZÜM'}</div>` + lines.map((l, i) => `<div class="sl" style="animation-delay:${(0.3 + i * gap).toFixed(2)}s">${l}</div>`).join('');
  const sol = $('sol'); let fs = 44; sol.style.fontSize = fs + 'px'; sol.querySelectorAll('.sl').forEach(e => e.style.clipPath = 'none');
  while (sol.scrollHeight > sol.clientHeight + 2 && fs > 26) { fs -= 2; sol.style.fontSize = fs + 'px'; }
  sol.querySelectorAll('.sl').forEach(e => e.style.clipPath = '');
  setTimeout(() => { if (GAME.q === Q) { $('qnext').textContent = ok ? 'Devam ▶' : 'Anladım, devam ▶'; $('qnext').classList.remove('hide'); } }, (0.3 + lines.length * gap) * 1000 + (ok ? 0 : 300));
}
function qContinue() {
  const Q = GAME.q; if (!Q || !Q.answered || $('qnext').classList.contains('hide')) return; SFX.click();
  GAME.q = null; $('qc').classList.add('hide'); $('sub').classList.remove('q'); CAM.gvo = -200;
  if (Q.q.after) Q.q.after(GAME.M.S, GAME.M);
  next();
}
function finish() {
  const M = GAME.M, r = GAME.total ? GAME.first / GAME.total : 1, y = r >= 0.9 ? 3 : r >= 0.6 ? 2 : 1;
  done[M.no] = Math.max(done[M.no] || 0, y); try { localStorage.setItem('ch_yildiz', JSON.stringify(done)); } catch (e) {}
  setTimeout(() => SFX.win(), 200);
  const nx = MISSIONS[MISSIONS.indexOf(M) + 1];
  overlay(`<div class="ov-ic">🏆</div><div class="ov-b">GÖREV TAMAMLANDI!</div><div class="ov-t">${M.name}</div>
    <div class="ov-y">${'★'.repeat(y)}${'☆'.repeat(3 - y)}</div><div class="ov-s">İlk denemede doğru: ${GAME.first} / ${GAME.total}</div>
    <div class="ov-dg"><button class="btn" id="ovT">↺ Tekrar oyna</button><button class="btn" id="ovM">☰ Menü</button>${nx ? `<button class="btn ana" id="ovN">Sonraki görev ▶</button>` : ''}</div>`);
  $('ovT').onclick = () => { SFX.click(); startMission(M); };
  $('ovM').onclick = () => { SFX.click(); toMenu(); };
  if (nx) $('ovN').onclick = () => { SFX.click(); startMission(nx); };
}
function toMenu() {
  stopLoops(); GAME.mode = 'menu'; GAME.M = null; GAME.q = null; closeOverlay();
  ['top', 'board', 'qc', 'go', 'ctl', 'durRozet', 'hizRozet'].forEach(id => $(id).classList.add('hide')); CTL.dur = false; sub(''); $('sub').classList.remove('q');
  buildMenu(); $('menu').classList.remove('hide'); menuScene();
}
function menuScene() { showOnly(M4); M4.S = { s: ROLL.sTop, run: false, stop: 'x', cx: 0, tc: -1 }; setPlate(27, 9, -2.4, -0.4); CAM.gvo = CAM.vo = 0; }

// düğmeler ve klavye
$('go').onclick = () => { if ($('go').classList.contains('hide')) return; SFX.click(); if (CTL.dur) setDur(false); $('go').classList.add('hide'); GAME.goFn && GAME.goFn(); };
$('qnext').onclick = qContinue;
$('bSes').onclick = () => { ac(); setSes(!AU.on); };
$('bMenu').onclick = () => { SFX.click(); toMenu(); };
$('bBas').onclick = () => { SFX.click(); if (GAME.M) startMission(GAME.M); };
const fullscreen = () => { const d = document.documentElement; if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); else document.exitFullscreen && document.exitFullscreen(); };
$('bFs').onclick = fullscreen;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') return fullscreen();
  if (k === 'm') { ac(); return setSes(!AU.on); }
  if (GAME.mode === 'game' && k === 'p') return setDur(!CTL.dur);
  if (GAME.mode === 'game' && (k === '+' || k === '-' || k === '=')) { const L = [0.25, 0.5, 1, 2], i = L.indexOf(CTL.hiz); return setHiz(L[clamp(i + (k === '-' ? -1 : 1), 0, 3)]); }
  if (GAME.mode !== 'game') return;
  if (!$('ov').classList.contains('hide')) { if (k === ' ' || k === 'enter') { e.preventDefault(); const b = $('ovGo') || $('ovN'); b && b.click(); } return; }
  const idx = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[k];
  if (GAME.q && !GAME.q.answered && idx != null) return answer(idx);
  if (k === ' ' || k === 'enter' || k === 'arrowright') { e.preventDefault(); if (GAME.q) qContinue(); else if (!$('go').classList.contains('hide')) $('go').click(); }
});
addEventListener('resize', fit);

// ======================= DURAKLAT / HIZ =======================
const CTL = { dur: false, hiz: 1 };
const IC_DUR = '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';
const IC_DEV = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
function setDur(d) {
  CTL.dur = d; $('bDur').innerHTML = d ? IC_DEV + 'Devam' : IC_DUR + 'Duraklat'; $('bDur').classList.toggle('dur', d);
  $('durRozet').classList.toggle('hide', !d); hizRozet();
  if (d) AU.loops.forEach(l => l.set(0));
}
function setHiz(h) {
  CTL.hiz = h; [...document.querySelectorAll('#ctl button[data-h]')].forEach(b => b.classList.toggle('on', +b.dataset.h === h)); hizRozet();
}
function hizRozet() { const r = $('hizRozet'); const t = { 0.25: 'Yavaş çekim ¼×', 0.5: 'Yavaş çekim ½×', 2: 'Hızlı 2×' }[CTL.hiz];
  r.textContent = t || ''; r.classList.toggle('hide', !t || CTL.dur || GAME.mode !== 'game'); }
$('bDur').onclick = () => { SFX.click(); setDur(!CTL.dur); };
document.querySelectorAll('#ctl button[data-h]').forEach(b => b.onclick = () => { SFX.click(); setHiz(+b.dataset.h); });
setDur(false);

// ======================= ANA DÖNGÜ =======================
let last = performance.now(), menuT = 0;
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;              // kamera için gerçek zaman
  const dt = (CTL.dur ? 0 : CTL.hiz) * rdt * (window.__hiz || 1);          // fizik zamanı: duraklat / yavaş çekim / hızlı
  for (const a of ARROWS) a.visible = false; guide1.visible = false;
  for (const k in TAG) TAG[k]._on = false;
  if (GAME.mode === 'game' && GAME.M) {
    const M = GAME.M; M.tick(dt); qlabTick(); dimArrows(); if (CTL.dur) AU.loops.forEach(l => l.set(0));
    if (GAME.wait && $('ov').classList.contains('hide')) { if (GAME.wait(M.S)) { GAME.wait = null; next(); } }
    else if (GAME.timer > 0) { GAME.timer -= dt; if (GAME.timer <= 0) { GAME.timer = 0; next(); } }
  } else {                                                  // menü: tren sahnesi yavaşça döner
    menuT += rdt; const c = coaster(ROLL.sTop); wagon.position.copy(c.p); wagon.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(c.f, V3().crossVectors(V3().crossVectors(c.f, c.u), c.f).normalize(), V3().crossVectors(c.f, c.u).normalize()));
    cDot.visible = false; const a = menuT * 0.08; camGoal([-3 + Math.sin(a) * 15, 7, Math.cos(a) * 15], [-3, 2.2, 0], false);
  }
  for (const k in TAG) if (!TAG[k]._on) TAG[k].style.opacity = 0;
  camStep(rdt); R3.render(scene, cam);
  requestAnimationFrame(frame);
}
fit(); setSes(AU.on); buildMenu(); menuScene(); camGoal([-3, 7, 15], [-3, 2.2, 0], true); requestAnimationFrame(frame);
window.__oyun = { GAME, MISSIONS, startMission, answer, qContinue, next }; window.__ROLL = ROLL;
</script></body></html>
