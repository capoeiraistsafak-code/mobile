.q{height:580px;font-size:15px;line-height:1.42}

.vline{bottom:20px}

.sc{position:absolute;left:0;width:450px}
.em{position:absolute;font-family:"Noto Color Emoji";line-height:1;transform-origin:50% 50%}
.lab{position:absolute;font:700 12px Inter;color:#5b6270}
.dy{list-style:none;margin-top:4px}

.cv-logo.sm{width:280px;height:280px;margin-top:40px}

.cv-bot{position:absolute;bottom:90px;font:700 40px Inter;color:#fff;opacity:.9}

/* giriş animasyonu (soru + hikâye): koyu arka plan */
#hook{position:absolute;inset:0;z-index:7;opacity:0;background:radial-gradient(circle at 50% 45%,#3a4150,#1f232c);overflow:hidden}

.hk-q{position:absolute;left:50px;right:50px;top:200px;text-align:center;font:900 78px/1.18 Inter;color:#fff}
.hkw{display:inline-block;opacity:0}
.hkw.vrg{color:#1f232c;background:#F5C400;padding:0 12px;border-radius:12px}
.hk-sc{position:absolute;left:0;top:760px;width:1080px;height:1000px}

.hk-big{position:absolute;font:900 220px Inter;color:#F5C400;opacity:0;text-shadow:0 10px 40px rgba(0,0,0,.5)}

.grid line{stroke:#e3e7ee;stroke-width:1}

.qt b{color:#D62828}
